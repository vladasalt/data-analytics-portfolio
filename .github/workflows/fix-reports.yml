name: Fix portfolio PDF reports

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF dependency
        run: python -m pip install --quiet reportlab

      - name: Generate validated PDF reports
        run: |
          python - <<'PY'
          from reportlab.lib.pagesizes import A4
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle
          from reportlab.lib import colors
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib.enums import TA_CENTER
          from reportlab.lib.units import mm
          import os

          os.makedirs('build_reports', exist_ok=True)
          styles = getSampleStyleSheet()
          styles.add(ParagraphStyle(name='Title2', parent=styles['Title'], fontSize=22, leading=27, alignment=TA_CENTER, spaceAfter=14))
          styles.add(ParagraphStyle(name='Sub', parent=styles['Normal'], fontSize=10, leading=14, alignment=TA_CENTER, textColor=colors.grey, spaceAfter=18))
          styles.add(ParagraphStyle(name='H', parent=styles['Heading2'], fontSize=14, leading=18, spaceBefore=10, spaceAfter=7))
          styles.add(ParagraphStyle(name='Body2', parent=styles['BodyText'], fontSize=9.5, leading=14, spaceAfter=7))

          def footer(canvas, doc):
              canvas.saveState(); canvas.setFont('Helvetica', 8); canvas.setFillColor(colors.grey)
              canvas.drawString(20*mm, 10*mm, 'Data Analytics Portfolio')
              canvas.drawRightString(190*mm, 10*mm, f'Page {doc.page}')
              canvas.restoreState()

          def build(path, title, subtitle, story):
              doc = SimpleDocTemplate(path, pagesize=A4, rightMargin=18*mm, leftMargin=18*mm, topMargin=18*mm, bottomMargin=16*mm)
              doc.build([Paragraph(title, styles['Title2']), Paragraph(subtitle, styles['Sub'])] + story, onFirstPage=footer, onLaterPages=footer)

          # NHS
          s=[Paragraph('1. Research question',styles['H']),Paragraph('Does NHS satisfaction differ across income, marital status, children, sex, education and age in the British Social Attitudes Survey 2021?',styles['Body2']),Paragraph('2. Data and analytical approach',styles['H']),Paragraph('The project uses the British Social Attitudes Survey 2021. NHS satisfaction is treated as a continuous outcome for parametric analysis, with a 0.05 significance level. The workflow uses labelled-variable recoding, complete-case analysis, descriptive summaries, an independent-samples t-test, a Chi-square test and simple linear regression.',styles['Body2']),Paragraph('3. Sample',styles['H']),Paragraph('The complete-case analytical sample reported in the project is N = 3,307. The mean NHS satisfaction score is 2.60. Non-substantive responses were excluded and age bands were represented using midpoints for the regression analysis.',styles['Body2']),Paragraph('4. Income comparison',styles['H'])]
          data=[['Income band','Mean NHS satisfaction'],['Below £1,410','2.49'],['£1,411–£2,560','2.70'],['£2,561–£4,350','2.66'],['£4,351+','2.56']]
          t=Table(data,colWidths=[80*mm,70*mm]); t.setStyle(TableStyle([('BACKGROUND',(0,0),(-1,0),colors.lightgrey),('GRID',(0,0),(-1,-1),0.4,colors.grey),('ALIGN',(1,1),(-1,-1),'CENTER'),('FONTNAME',(0,0),(-1,0),'Helvetica-Bold'),('FONTSIZE',(0,0),(-1,-1),9),('BOTTOMPADDING',(0,0),(-1,-1),6),('TOPPADDING',(0,0),(-1,-1),6)])); s += [t,Spacer(1,8),Paragraph('The observed means are close together, suggesting only modest differences in satisfaction across income groups.',styles['Body2']),Paragraph('5. Inferential results',styles['H']),Paragraph('Sex: the independent-samples t-test gave t = -0.78 and p = 0.437, so there is no statistically significant evidence of a difference in mean NHS satisfaction by sex at the 5% level.',styles['Body2']),Paragraph('Education: the Chi-square test gave χ² = 10.84, df = 6, p = 0.093. This does not reach the 5% significance threshold.',styles['Body2']),Paragraph('Age: the simple linear regression estimated a slope of 0.00117 with p = 0.717 and approximately zero R². There is therefore no evidence of a linear relationship between age and NHS satisfaction in this analysis.',styles['Body2']),Paragraph('6. Marital status and children',styles['H']),Paragraph('Descriptive means were 2.63 for married/cohabiting respondents, 2.52 for divorced/separated respondents, 2.88 for widowed respondents (n = 16, so interpret cautiously), and 2.55 for single respondents. Respondents with children averaged 2.56 versus 2.63 for those without children. These are descriptive comparisons rather than causal effects.',styles['Body2']),Paragraph('7. Limitations and conclusion',styles['H']),Paragraph('The analysis is cross-sectional and observational, so associations should not be interpreted causally. NHS satisfaction is measured on a discrete response scale even though it is analysed as continuous, and complete-case analysis can introduce selection bias. Overall, the examined socio-demographic variables provide weak evidence of systematic differences in NHS satisfaction in this sample.',styles['Body2'])]
          build('01_nhs_satisfaction/project_report.pdf','NHS Satisfaction Analysis','British Social Attitudes Survey 2021 | R | Quantitative Research',s)

          # Customer churn
          s=[Paragraph('1. Project objective',styles['H']),Paragraph('Identify patterns associated with customer churn and translate the findings into practical retention insights for a telecommunications business.',styles['Body2']),Paragraph('2. Dataset',styles['H']),Paragraph('The project uses the IBM Telco Customer Churn dataset with 7,043 customer records. The analysis focuses on contract type, payment method, tenure and monthly charges.',styles['Body2']),Paragraph('3. Analytical workflow',styles['H']),Paragraph('The R workflow imports the customer-level CSV, converts churn, contract and payment method to factors, calculates churn rates by contract and payment method, compares tenure and monthly charges by churn status, and applies Chi-square tests to assess whether churn is associated with contract type or payment method.',styles['Body2']),Paragraph('4. Key analytical questions',styles['H'])]
          q=[['Question','Method'],['Does churn vary by contract type?','Churn-rate comparison + Chi-square'],['Does churn vary by payment method?','Churn-rate comparison + Chi-square'],['Do churned customers differ in tenure?','Group descriptive comparison'],['Do churned customers differ in monthly charges?','Group descriptive comparison']]
          t=Table(q,colWidths=[80*mm,70*mm]); t.setStyle(TableStyle([('BACKGROUND',(0,0),(-1,0),colors.lightgrey),('GRID',(0,0),(-1,-1),0.4,colors.grey),('FONTNAME',(0,0),(-1,0),'Helvetica-Bold'),('FONTSIZE',(0,0),(-1,-1),9),('VALIGN',(0,0),(-1,-1),'TOP'),('BOTTOMPADDING',(0,0),(-1,-1),6),('TOPPADDING',(0,0),(-1,-1),6)])); s += [t,Spacer(1,8),Paragraph('5. Interpretation framework',styles['H']),Paragraph('Contract and payment-method differences are useful for retention because they describe customer commitment and billing behaviour. Tenure provides a lifecycle perspective, while monthly charges help identify the commercial value of customers who leave. The supporting charts in the repository visualise these relationships.',styles['Body2']),Paragraph('6. Business implications',styles['H']),Paragraph('Retention activity should be targeted rather than applied uniformly. Customer segments showing higher observed churn can be prioritised for onboarding support, contract incentives, payment-method education or proactive service outreach. Observational associations should not be treated as causal effects without further testing.',styles['Body2']),Paragraph('7. Reproducibility',styles['H']),Paragraph('The repository includes analysis.R and supporting PNG visualisations. The original dataset is expected locally and is not redistributed by the project. Running the script with the CSV in the project directory reproduces the descriptive summaries and statistical tests.',styles['Body2'])]
          build('02_customer_churn/project_report.pdf','Customer Churn & Retention Analysis','IBM Telco Customer Churn Dataset | R | Customer Analytics',s)

          # Restaurant
          s=[Paragraph('1. Objective',styles['H']),Paragraph('Examine how restaurant bill size varies by day, smoking status and meal period, and test whether party size is associated with total bill value.',styles['Body2']),Paragraph('2. Dataset and methods',styles['H']),Paragraph('The project uses the Plotly Express tips dataset containing 244 restaurant bills. Variables include total bill, tip, sex, smoker, day, time and party size. Analysis is conducted in Python using pandas, SciPy and statsmodels.',styles['Body2']),Paragraph('3. Statistical workflow',styles['H']),Paragraph('The analysis calculates descriptive statistics by day, smoking status and meal period; applies a Welch independent-samples t-test comparing smokers and non-smokers; constructs low/medium/high bill categories for a Chi-square analysis by day; and estimates a simple OLS regression of total bill on party size.',styles['Body2']),Paragraph('4. Assumption and sensitivity checks',styles['H']),Paragraph('Normality is assessed using Shapiro-Wilk tests, variance equality using Levene’s test, and regression residuals using Shapiro-Wilk and Breusch-Pagan diagnostics. HC3 robust standard errors are also calculated as a sensitivity check.',styles['Body2']),Paragraph('5. Business interpretation',styles['H']),Paragraph('Party size is a natural operational driver of bill value and can inform table allocation, staffing and capacity planning. Differences by day, smoking status or meal period can help managers understand demand patterns. These relationships are observational and should not be interpreted as causal without a stronger design.',styles['Body2']),Paragraph('6. Reproducibility',styles['H']),Paragraph('The repository contains analysis.py, the tips.csv dataset, supporting visualisations and this report. The script can be run from the project directory after installing pandas, numpy, scipy and statsmodels.',styles['Body2'])]
          build('03_restaurant_spending/project_report.pdf','Restaurant Spending Analysis','Plotly Express tips dataset | Python | Quantitative Analytics',s)
          PY

      - name: Remove accidental placeholder files
        run: |
          rm -f 01_nhs_satisfaction/project_report_clean.pdf
          rm -f 02_customer_churn/project_report_clean.pdf
          rm -f 03_restaurant_spending/project_report_clean.pdf
          rm -f 01_nhs_satisfaction/REPORT_FIXED.txt
          rm -f README_FIX_NOTE.md
          rm -f temp.txt temp2.txt temp3.txt test.pdf

      - name: Commit repaired reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_nhs_satisfaction/project_report.pdf 02_customer_churn/project_report.pdf 03_restaurant_spending/project_report.pdf .github/workflows/fix-reports.yml
          git add -u
          git diff --cached --quiet || git commit -m "Replace portfolio reports with valid PDFs"
          git push
