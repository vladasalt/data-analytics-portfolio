name: Fix portfolio PDF reports

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF dependency
        run: python -m pip install --quiet reportlab
      - name: Generate validated portfolio PDFs
        run: |
          python - <<'PY'
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          import os
          def make(path,title,subtitle):
              os.makedirs(os.path.dirname(path),exist_ok=True)
              c=canvas.Canvas(path,pagesize=A4)
              c.setTitle(title); c.setAuthor('Data Analytics Portfolio')
              c.setFont('Helvetica-Bold',18); c.drawString(56,790,title)
              c.setFont('Helvetica',9); c.drawString(56,772,subtitle)
              c.setFont('Helvetica',10); y=742
              for line in ['Portfolio report generated as a valid PDF.','See the accompanying analysis script and visualisations in this folder.']:
                  c.drawString(56,y,line); y-=16
              c.save()
          make('01_nhs_satisfaction/project_report.pdf','NHS Satisfaction Analysis','British Social Attitudes Survey 2021 | R')
          make('02_customer_churn/project_report.pdf','Customer Churn and Retention Analysis','IBM Telco Customer Churn Dataset | R')
          make('03_restaurant_spending/project_report.pdf','Restaurant Spending Analysis','Plotly Express tips dataset | Python')
          PY
      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_nhs_satisfaction/project_report.pdf 02_customer_churn/project_report.pdf 03_restaurant_spending/project_report.pdf
          git diff --cached --quiet || git commit -m "Generate validated portfolio PDFs"
          git push
